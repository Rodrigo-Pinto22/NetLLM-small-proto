[project]
name = "netllm-small-proto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=5.0.1",
    "gradio>=6.29.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pymupdf4llm>=1.28.2",
    "rapidfuzz>=3.14.6",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.18.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Ingestion_01", "Encoder_02", "Evaluation_04"]
